name: Facebook Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    # 👇 Yeh env block pure job ke liye Node 24 force kar dega
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 👈 Node 20 ko hata kar 24 kar diya

      - run: npm install

      - run: node upload-facebook.js
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}