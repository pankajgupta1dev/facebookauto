name: AI Facts Auto Post

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # FFmpeg drawtext filter ke liye fonts install karna safe rehta hai
      - name: Install Base Fonts for FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ttf-dejavu

      - name: Install Dependencies
        run: npm install

      # Fixed: Saare environment variables ek hi env block me combine kar diye hain
      - name: Run Main Script
        run: node main.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}