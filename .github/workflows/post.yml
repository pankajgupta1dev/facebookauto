name: Daily AI Video

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 1. Sabse pehle proper FFmpeg setup karega (saare filters ke sath)
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Fir node modules install honge
      - name: Install Dependencies
        run: npm install

      # 3. Last me aapka script run hoga jab sab ready hai
      - name: Run Main Script
        run: node main.js
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}