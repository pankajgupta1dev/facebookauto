name: Daily AI Video

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Is action me bina kisi website error ke direct GitHub mirror se fast download hota hai
      - name: Setup FFmpeg
        uses: bencevans/setup-ffmpeg@v1
        with:
          version: '6.0'

      - name: Install Dependencies
        run: npm install

      - name: Run Main Script
        run: node main.js
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}